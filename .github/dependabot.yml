# Wöchentliche Abhängigkeits-Updates (04-rule-quality.md, Kap. 6.4).
version: 2
updates:
  - package-ecosystem: npm
    directory: /project
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /project/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /project/client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /project/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
