# Minimal-Kubeconfig für den Ethos-int-Cluster ethos105-stage-or2 (EKS), persönlicher Device-Code-Login.
# Ersetzt das Klonen von git.corp.adobe.com/adobe-platform/k8s-kubeconfig (dafür braucht man einen git.corp-Account).
# Die IDs stammen aus dem kanonischen User "adobe" der Ethos-Kubeconfig. Es sind öffentliche Azure-AD-App-IDs, keine Geheimnisse.
# Voraussetzung: brew install Azure/kubelogin/kubelogin
apiVersion: v1
kind: Config
clusters:
- name: ethos105stageor2
  cluster:
    server: https://apiserver.corp.ethos105-stage-or2.ethos.adobe.net
contexts:
- name: ethos105-stage-or2
  context:
    cluster: ethos105stageor2
    user: adobe
    namespace: ns-team-techstack-analyzer
current-context: ethos105-stage-or2
users:
- name: adobe
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      command: kubelogin
      args:
      - get-token
      - --login
      - devicecode
      - --server-id
      - 41abc0c6-712d-4619-9b79-b96da7ffa825
      - --client-id
      - 752c7d7f-e651-4ac3-939b-a049f390e19a
      - --tenant-id
      - fa7b1b5a-7b34-4387-94ae-d2c178decee1
      - --legacy
      interactiveMode: IfAvailable
