services:
  mariadb:
    image: mariadb:11
    container_name: ${CONTAINER_PREFIX:-techstack-}mariadb
    environment:
      # Keine Default-Passwörter: fehlt eine Variable, bricht Compose bewusst ab.
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD muss gesetzt sein}
      - MYSQL_DATABASE=${DB_NAME:-techstack_crawler}
      - MYSQL_USER=${DB_USER:-techstack}
      - MYSQL_PASSWORD=${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
    volumes:
      - techstack_mariadb_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: ${CONTAINER_PREFIX:-techstack-}caddy
    ports:
      # HOST_BIND=172.17.0.1 beschränkt den Port auf die Docker-Bridge (nur der Hub-Caddy
      # kommt dann dran, kein Klartext-HTTP aus dem Corp-Netz). Achtung: Der Health-Check
      # in `make deploy` greift von außen auf den Port zu und muss dann angepasst werden.
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8516}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - techstack
    restart: unless-stopped

  techstack:
    image: techstack-app
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: ${CONTAINER_PREFIX:-techstack-}techstack
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - BEDROCK_API_KEY=${BEDROCK_API_KEY}
      - BEDROCK_ENDPOINT=${BEDROCK_ENDPOINT:-https://bedrock-runtime.us-west-2.amazonaws.com}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-us.anthropic.claude-sonnet-4-6}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-eleven_v3}
      - OKTA_CLIENT_ID=${OKTA_CLIENT_ID}
      - OKTA_CLIENT_SECRET=${OKTA_CLIENT_SECRET}
      - OKTA_REDIRECT_URI=${OKTA_REDIRECT_URI}
      - OKTA_ISSUER=${OKTA_ISSUER:-https://adobe.okta.com}
      - OKTA_SCOPES=${OKTA_SCOPES:-openid profile email}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-daudert@adobe.com}
      # Break-Glass-Login: nur aktiv, wenn beide Werte gesetzt sind.
      - DASHBOARD_EMAIL=${DASHBOARD_EMAIL:-}
      - DASHBOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH:-}
      # CORS: leer = nur Same-Origin (Standard); sonst komma-getrennte Origin-Liste.
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=${DB_USER:-techstack}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
      - DB_NAME=${DB_NAME:-techstack_crawler}
    restart: unless-stopped

volumes:
  techstack_mariadb_data:
  caddy_data:
