# TechStack Analyzer auf Ethos (Nicht-Corp-Cluster, erreichbar vom CX Coworker Gateway).
# Platzhalter (__NAMESPACE__, __IMAGE__, __HOST__, __MARIADB_IMAGE__) ersetzt `make ethos-deploy`.
# Secrets kommen aus dem Secret `techstack-env` (`make ethos-secrets`), nie aus dieser Datei.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: techstack-mariadb-data
  namespace: __NAMESPACE__
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techstack-mariadb
  namespace: __NAMESPACE__
  labels: { app: techstack-mariadb }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: techstack-mariadb }
  template:
    metadata:
      labels: { app: techstack-mariadb }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mariadb
          image: __MARIADB_IMAGE__
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MARIADB_DATABASE, value: techstack_crawler }
            - name: MARIADB_USER
              valueFrom: { secretKeyRef: { name: techstack-env, key: DB_USER } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: techstack-env, key: DB_PASSWORD } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: techstack-env, key: DB_ROOT_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
          readinessProbe:
            exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: [healthcheck.sh, --connect] }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: techstack-mariadb-data }
---
apiVersion: v1
kind: Service
metadata:
  name: techstack-mariadb
  namespace: __NAMESPACE__
spec:
  selector: { app: techstack-mariadb }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techstack
  namespace: __NAMESPACE__
  labels: { app: techstack }
spec:
  replicas: 1
  selector:
    matchLabels: { app: techstack }
  template:
    metadata:
      # use-default-egress-policy: EKO-Policy np-eko--default erlaubt dann Egress 0.0.0.0/0:80,443 (ohne RFC1918)
      # → öffentliche Websites crawlen + Bedrock. Ingress/DNS/MariaDB regeln die Policies unten.
      labels: { app: techstack, use-default-egress-policy: "true" }
    spec:
      imagePullSecrets: [{ name: ghcr-secret }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: techstack
          image: __IMAGE__
          ports: [{ containerPort: 3001 }]
          envFrom:
            - secretRef: { name: techstack-env }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3001" }
            - { name: DB_HOST, value: techstack-mariadb }
            - { name: DB_PORT, value: "3306" }
            - { name: DB_NAME, value: techstack_crawler }
          readinessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            # Chromium-Worker (Scrapling) brauchen je ~300–500 MB; Multi-Page-Crawl läuft 2-fach parallel.
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # Chromium crasht mit dem 64-MB-Default von /dev/shm.
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: techstack
  namespace: __NAMESPACE__
spec:
  selector: { app: techstack }
  ports: [{ port: 80, targetPort: 3001 }]
---
# Ethos int-Cluster: Contour (contour-internal) statt Traefik; TLS-Secret für *.int.ethos = cluster-ssl-int.
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: techstack
  namespace: __NAMESPACE__
  annotations:
    kubernetes.io/ingress.class: contour-internal
spec:
  virtualhost:
    fqdn: __HOST__
    tls:
      secretName: heptio-contour/cluster-ssl-int
  routes:
    - conditions: [{ prefix: / }]
      # analyze-url läuft 30–100 s (Headless-Browser + LLM); Contour-Default ist 15 s.
      timeoutPolicy: { response: 300s, idle: 300s }
      services:
        - name: techstack
          port: 80
---
# *.int ist nur aus Adobe-Rechenzentren erreichbar (für das Coworker-Gateway).
# Für Browser/Tests über VPN gibt es zusätzlich *.corp (contour-corp, cluster-ssl-corp).
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: techstack-corp
  namespace: __NAMESPACE__
  annotations:
    kubernetes.io/ingress.class: contour-corp
spec:
  virtualhost:
    fqdn: __CORP_HOST__
    tls:
      secretName: heptio-contour/cluster-ssl-corp
  routes:
    - conditions: [{ prefix: / }]
      timeoutPolicy: { response: 300s, idle: 300s }
      services:
        - name: techstack
          port: 80
---
# Namespaces auf Ethos sind default-deny. Die folgenden Policies öffnen nur, was die App braucht.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: techstack-allow-ingress-contour
  namespace: __NAMESPACE__
spec:
  podSelector: { matchLabels: { app: techstack } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: heptio-contour } }
      ports: [{ protocol: TCP, port: 3001 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: techstack-allow-dns
  namespace: __NAMESPACE__
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: techstack-allow-app-to-mariadb
  namespace: __NAMESPACE__
spec:
  podSelector: { matchLabels: { app: techstack } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: techstack-mariadb } } }]
      ports: [{ protocol: TCP, port: 3306 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: techstack-mariadb-allow-from-app
  namespace: __NAMESPACE__
spec:
  podSelector: { matchLabels: { app: techstack-mariadb } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: techstack } } }]
      ports: [{ protocol: TCP, port: 3306 }]
